<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif: Belajar dan Pembelajaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hidden { display: none !important; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes blob { 
            0% { transform: translate(0px, 0px) scale(1); } 
            33% { transform: translate(30px, -50px) scale(1.1); } 
            66% { transform: translate(-20px, 20px) scale(0.9); } 
            100% { transform: translate(0px, 0px) scale(1); } 
        }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.3s ease-out forwards; }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        .question-enter { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .option-card { transition: all 0.2s ease-in-out; }
        .option-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.1), 0 4px 6px -2px rgba(99, 102, 241, 0.05);
            border-color: #a5b4fc;
        }
        
        .radio-wrapper input:checked + label {
            background-color: #eef2ff;
            border-color: #6366f1;
        }
        .radio-wrapper input:checked + label span { color: #312e81; font-weight: 600; }
        
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid #cbd5e1;
            border-radius: 0.3em;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .checkbox-wrapper input:checked + label .custom-checkbox {
            background-color: #6366f1;
            border-color: #6366f1;
        }
        .checkbox-wrapper input:checked + label {
            background-color: #eef2ff;
            border-color: #6366f1;
        }
        .checkbox-wrapper input:checked + label span { color: #312e81; font-weight: 600; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 relative text-slate-800 font-sans selection:bg-indigo-100 selection:text-indigo-900 overflow-x-hidden">

            <h3 class="text-xl font-bold text-slate-800 mb-4 shrink-0 border-b-2 border-slate-100 pb-3 flex items-center">

            <!-- Scrollable Review Section -->

            <div class="mt-6 text-center shrink-0 pt-6 border-t-2 border-slate-100">

    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 transition-opacity backdrop-blur-sm p-4">

            <div class="flex items-center mb-4 text-indigo-600">

    <script>
        // Quiz Data based on the provided document
        const quizData = [
            {
                number: 1,
                question: "Seorang guru Bahasa Inggris memperhatikan bahwa siswanya dapat mengenali kata-kata baru saat membaca (Tahap Acquisition) dan menyimpannya dalam memori jangka panjang (Tahap Storage), namun kesulitan memanggil kembali kata-kata tersebut saat diminta berbicara secara spontan. Berdasarkan tahapan pemrosesan kognitif menurut Witting, tahapan mana yang mengalami hambatan?",
                type: "single",
                options: [
                    "A. Tahap Perolehan (Acquisition)",
                    "B. Tahap Penyimpanan (Storage)",
                    "C. Tahap Pengungkapan Kembali (Retrieval)",
                    "D. Tahap Inkubasi Kognitif"
                ],
                answer: [2], // Index C
                explanation: "Siswa telah berhasil pada tahap Acquisition (mengenali) dan Storage (menyimpan dalam ingatan), namun mengalami hambatan saat mengakses atau memanggil kembali informasi tersebut dari memori saat berbicara spontan (Retrieval)."
            },
            {
                number: 2,
                question: "Dalam sebuah kelas EFL, Pak Budi tidak hanya mengajarkan tata bahasa (kognitif), tetapi juga membimbing siswa agar menghargai kebudayaan sasaran serta berani mengekspresikan pendapat tanpa takut salah. Perubahan perilaku siswa yang mulai menerima dan menginternalisasi nilai rasa percaya diri ini termasuk dalam kawasan hasil belajar Bloom yaitu...",
                type: "single",
                options: [
                    "A. Domain Kognitif",
                    "B. Domain Afektif",
                    "C. Domain Psikomotorik",
                    "D. Domain Metakognitif"
                ],
                answer: [1], // Index B
                explanation: "Menerima, menghargai kebudayaan sasaran, dan menginternalisasi nilai rasa percaya diri merupakan perubahan sikap, minat, dan emosi yang secara eksplisit tergolong dalam kawasan afektif Taksonomi Bloom."
            },
            {
                number: 3,
                question: "Berdasarkan pandangan Suryosubroto (1997) mengenai hubungan antara belajar dan pembelajaran, manakah pernyataan berikut yang paling tepat membedakan peran keduanya dalam situasi kelas?",
                type: "single",
                options: [
                    "A. Belajar dan pembelajaran adalah dua istilah identik yang menggambarkan aktivitas mengajar guru.",
                    "B. Belajar merupakan kegiatan primer berupa proses kognitif internal siswa, sedangkan pembelajaran adalah kegiatan sekunder guru untuk merekayasa lingkungan.",
                    "C. Pembelajaran merupakan proses internal siswa, sedangkan belajar adalah tindakan fisik guru di depan kelas.",
                    "D. Belajar bersifat sekunder dan pasif, sedangkan pembelajaran bersifat primer dan independen dari tujuan kurikulum."
                ],
                answer: [1],
                explanation: "Suryosubroto (1997) menegaskan bahwa belajar bersifat primer karena terjadi secara internal pada diri siswa, sedangkan mengajar/pembelajaran bersifat sekunder untuk merekayasa lingkungan agar mendukug proses primer tersebut."
            },
            {
                number: 4,
                question: "Bu Anita secara rutin memberikan latihan pronunciation dan pengulangan pola kalimat (pattern drill) setiap awal sesi perkuliahan agar otot bicara dan memori siswa terbiasa dengan fonem Bahasa Inggris. Prinsip pembelajaran umum yang diterapkan Bu Anita mengacu pada...",
                type: "single",
                options: [
                    "A. Prinsip Perbedaan Individu",
                    "B. Prinsip Pengulangan (Law of Exercise)",
                    "C. Prinsip Tantangan",
                    "D. Prinsip Keterlibatan Langsung"
                ],
                answer: [1],
                explanation: "Latihan pronunciation dan pattern drill secara rutin melatih organ bicara dan memperkuat hubungan stimulus-respons melalui pengulangan berkala (Law of Exercise)."
            },
            {
                number: 5,
                question: "Setiap kali mahasiswa selesai menyampaikan presentasi lisan dalam bahasa Inggris, dosen langsung memberikan umpan balik korektif mengenai tata bahasa dan memberikan pujian atas keberanian mahasiswa. Prinsip pembelajaran Dimyati dan Mudjiono yang diterapkan adalah...",
                type: "single",
                options: [
                    "A. Balikan dan Penguatan (Feedback & Reinforcement)",
                    "B. Keaktifan Fisik",
                    "C. Perhatian dan Motivasi",
                    "D. Transfer Belajar"
                ],
                answer: [0],
                explanation: "Memberikan umpan balik korektif tata bahasa (feedback) dan pujian atas keberanian (positive reinforcement) memberi kepastian hasil belajar dan dorongan positif untuk performa berikutnya."
            },
            {
                number: 6,
                question: "Seorang siswa EFL selalu terlihat lambat dalam merespons instruksi lisan di kelas dan sering membuat kesalahan ejaan. Setelah diperiksa, ternyata siswa tersebut mengalami gangguan pendengaran ringan yang tidak terdeteksi. Kasus ini menunjukkan pengaruh faktor belajar dari kategori...",
                type: "single",
                options: [
                    "A. Eksternal Sekolah: Sarana Prasarana",
                    "B. Internal Fisiologis: Kesehatan Fisik & Indera",
                    "C. Internal Psikologis: Inteligensi Rendah",
                    "D. Eksternal Lingkungan Sosial"
                ],
                answer: [1],
                explanation: "Gangguan organ pendengaran merupakan hambatan fisik dari dalam diri peserta didik (internal fisiologis) yang berdampak langsung pada kejelasan penerimaan rangsangan lisan di kelas."
            },
            {
                number: 7,
                question: "Saat menghadapi ujian tes berbicara (speaking test) yang sangat formal, Rian mengalami tingkat kecemasan (anxiety) yang sangat tinggi hingga pikirannya menjadi kosong dan tidak bisa menyusun kalimat sederhana. Secara kognitif-psikologis, kecemasan berlebih ini berdampak negatif karena...",
                type: "single",
                options: [
                    "A. Menghentikan pemrosesan sensorik di organ pendengaran",
                    "B. Menyumbat kapasitas pemrosesan memori kerja (working memory)",
                    "C. Mempercepat fungsi asosiasi di memori jangka panjang",
                    "D. Menghilangkan minat intrinsik secara permanen"
                ],
                answer: [1],
                explanation: "Tingkat kecemasan tinggi (anxiety) membebani kapasitas terbatas memori kerja (working memory), sehingga mengganggu proses sintesis dan artikulasi kalimat secara spontan."
            },

                answer: [0],

            },
            {

                question: "Sesuai Undang-Undang No. 14 Tahun 2005 tentang Guru dan Dosen, guru profesional wajib menguasai empat kompetensi utama. Manakah pilihan yang memuat keempat kompetensi tersebut secara lengkap?",
                type: "single",
                options: [

                    "D. Teknis, Konseptual, Manajerial, dan Komunikatif"
                ],
                answer: [0],
                explanation: "Empat kompetensi wajib guru menurut UU Guru dan Dosen secara eksplisit meliputi Pedagogik, Kepribadian, Sosial, dan Profesional."
            },
            {

                question: "Dalam konteks pembelajaran Bahasa Inggris sebagai bahasa asing (EFL), integrasi antara kecakapan Abad 21 (4C) dan pendekatan Communicative Language Teaching (CLT) paling nampak pada aktivitas kelas berupa...",
                type: "single",
                options: [
                    "A. Siswa diminta menyalin aturan grammar dari buku teks secara individual tanpa berbicara",
                    "B. Diskusi kelompok pemecahan masalah (Problem-Solving Group Work) untuk mendesain kampanye lingkungan berbahasa Inggris dan mempresentasikannya",
                    "C. Mendengarkan rekaman audio secara berulang-ulang tanpa diberi kesempatan bertanya",
                    "D. Mengumpulkan daftar kosakata baru beserta terjemahannya di buku catatan"
                ],
                answer: [1],
                explanation: "Aktivitas pemecahan masalah kelompok memadukan 4C (Critical Thinking, Collaboration, Communication, Creativity) secara terpadu dalam suasana komunikatif bermakna (CLT)."
            },
            {
                number: 37,
                question: "Seorang dosen Bahasa Inggris merancang materi kuliah membaca (reading) dengan mengintegrasikan media digital interaktif berbasis AI yang secara otomatis menyesuaikan tingkat kesulitan teks sesuai kecepatan membaca tiap mahasiswa. Tindakan dosen ini berlandaskan pada kombinasi dua teori belajar, yaitu...",
                type: "single",
                options: [
                    "A. Sibernetik (sistem informasi & AI) dan Kognitivisme/Prinsip Diferensiasi Individu",
                    "B. Behaviorisme dan Humanisme Klasik",
                    "C. Konstruktivisme Radikal dan Gestalt",
                    "D. Nondirective Teaching dan Pavlovian Conditioning"
                ],
                answer: [0],
                explanation: "Penggunaan AI berfokus pada alur pemrosesan sistem informasi (Sibernetik) yang disesuaikan dengan kapasitas kognitif individual mahasiswa (Kognitivisme)."
            },
            {
                number: 38,
                question: "Di dalam modul 'Belajar dan Pembelajaran', W. Gulo (2002) mendefinisikan belajar sebagai proses internal yang mengubah tiga domain utama dalam diri individu, yaitu...",
                type: "single",
                options: [
                    "A. Cara berpikir, bersikap, dan bertindak",
                    "B. Cara membaca, menulis, dan berhitung",
                    "C. Tingkat IQ, EQ, dan SQ",
                    "D. Bakat, minat, dan potensi fisik"
                ],
                answer: [0],
                explanation: "W. Gulo (2002) mengartikan hasil belajar sebagai perubahan pada tiga domain utama: cara berpikir (kognitif), bersikap (afektif), dan bertindak (psikomotorik)."
            },
            {
                number: 39,
                question: "Manakah di antara pernyataan berikut yang paling tepat menggambarkan kritik atau kelemahan Teori Belajar Behavioristik jika diterapkan dalam kelas bahasa tingkat lanjut (Advanced EFL)?",
                type: "single",
                options: [
                    "A. Sangat efektif untuk keterampilan motorik/pembiasaan rutin, namun lemah dalam mengembangkan pemikiran kognitif tingkat tinggi dan kreativitas berbahasa spontan",
                    "B. Terlalu memanjakan siswa dan mengabaikan peran guru sebagai pembimbing",
                    "C. Membutuhkan teknologi komputer canggih yang mahal",
                    "D. Mengabaikan aspek fisiologis indera siswa"
                ],
                answer: [0],
                explanation: "Behaviorisme bagus untuk pembiasaan rutin (drills), tetapi kurang memfasilitasi kreativitas berbahasa spontan dan pemikiran kritis tingkat tinggi."
            },
            {
                number: 40,
                question: "Seorang guru Bahasa Inggris ingin menerapkan Teori Belajar Konstruktivisme dalam pengajaran menulis esai argumentatif. Skenario pembelajaran mana yang paling selaras dengan teori tersebut?",
                type: "single",
                options: [
                    "A. Guru mendiktekan esai kalimat demi kalimat lalu meminta siswa menghafalnya",
                    "B. Guru memberikan rumus kaku lalu menghukum siswa yang membuat kesalahan tata bahasa",
                    "C. Guru membiarkan siswa memilih isu sosial hangat, melakukan riset mandiri, berdiskusi dengan teman sekelompok untuk membangun argumen, serta merumuskan esai berdasarkan pemahaman mereka sendiri",
                    "D. Guru meminta siswa membaca esai contoh tanpa melakukan diskusi atau analisis"
                ],
                answer: [2],
                explanation: "Skenario C paling mencerminkan konstruktivisme karena siswa aktif membangun pengetahuannya sendiri melalui investigasi, diskusi sosial, dan pembentukan argumen mandiri."
            }
        ];

        // State Variables
        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let timeRemaining = 120; // 2 minutes in seconds
        let timerInterval;

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const groupNameInput = document.getElementById('group-name');
        const startBtn = document.getElementById('start-btn');
        const displayGroupName = document.getElementById('display-group-name');
        
        const timerDisplay = document.getElementById('timer');
        const progressBar = document.getElementById('progress-bar');
        const questionNumber = document.getElementById('question-number');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const typeBadge = document.getElementById('question-type-badge');
        const questionWrapper = document.getElementById('question-wrapper');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');

        // Modal Elements
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalCancelBtn = document.getElementById('modal-cancel');
        const modalOkBtn = document.getElementById('modal-ok');
        let confirmCallback = null;

        function showModal(title, message, isConfirm = false, onConfirm = null) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            if (isConfirm) {
                modalCancelBtn.classList.remove('hidden');
                modalOkBtn.textContent = 'Ya, Selesai';
                confirmCallback = onConfirm;
            } else {
                modalCancelBtn.classList.add('hidden');
                modalOkBtn.textContent = 'Mengerti';
                confirmCallback = null;
            }
            
            customModal.classList.remove('hidden');
            const modalContent = customModal.querySelector('div');
            modalContent.classList.remove('animate-scale-in');
            void modalContent.offsetWidth;
            modalContent.classList.add('animate-scale-in');
        }

        function closeModal() {
            customModal.classList.add('hidden');
        }

        modalCancelBtn.addEventListener('click', closeModal);
        modalOkBtn.addEventListener('click', () => {
            closeModal();
            if (confirmCallback) {
                confirmCallback();
            }
        });

        // Initialization
        startBtn.addEventListener('click', startQuiz);

        function startQuiz() {
            const name = groupNameInput.value.trim();
            if (!name) {
                showModal("Perhatian!", "Silakan masukkan nama kelompok/peserta terlebih dahulu untuk memulai kuis.");
                return;
            }

            displayGroupName.textContent = name;
            loginScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            for(let i = 0; i < quizData.length; i++){
                if(quizData[i].type === 'multiple'){
                    userAnswers[i] = [];
                }
            }

            loadQuestion();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz(true);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeRemaining < 30) {
                const timerContainer = timerDisplay.parentElement;
                timerContainer.classList.remove('text-rose-500', 'bg-rose-50', 'border-rose-100');
                timerContainer.classList.add('text-white', 'bg-rose-600', 'border-rose-600');
                timerContainer.querySelector('svg').classList.add('animate-ping');
            }
        }

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            
            // Trigger Animasi CSS untuk masuknya teks pertanyaan
            questionWrapper.classList.remove('question-enter');
            void questionWrapper.offsetWidth; // trigger reflow DOM
            questionWrapper.classList.add('question-enter');

            questionNumber.textContent = `Soal ${currentQuestionIndex + 1} / ${quizData.length}`;
            questionText.innerHTML = q.question.replace(/\n/g, '<br>');

            const progress = ((currentQuestionIndex) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;

            if(q.type === 'multiple') {
                typeBadge.classList.remove('hidden');
            } else {
                typeBadge.classList.add('hidden');
            }

            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const isMultiple = q.type === 'multiple';
                const inputType = isMultiple ? 'checkbox' : 'radio';
                const inputName = `q${currentQuestionIndex}`;
                
                let isChecked = false;
                if (userAnswers[currentQuestionIndex] !== null) {
                    if (isMultiple) {
                        isChecked = userAnswers[currentQuestionIndex].includes(index);
                    } else {
                        isChecked = userAnswers[currentQuestionIndex] === index;
                    }
                }

                // Desain kartu opsi yang modern dengan efek hover yang menarik
                const optionHTML = `
                    <div class="${isMultiple ? 'checkbox-wrapper' : 'radio-wrapper'} option-card bg-white border-2 border-slate-100 rounded-xl relative overflow-hidden group mb-3 shadow-sm">
                        <input type="${inputType}" id="opt-${index}" name="${inputName}" value="${index}" 
                            class="${isMultiple ? 'hidden' : 'w-5 h-5 text-indigo-600 bg-slate-50 border-slate-300 focus:ring-indigo-500 absolute top-1/2 -translate-y-1/2 left-4 transition-transform group-hover:scale-110 cursor-pointer'}" 
                            ${isChecked ? 'checked' : ''}>
                        
                        <label for="opt-${index}" class="w-full h-full flex items-center p-4 ${isMultiple ? '' : 'pl-12'} cursor-pointer rounded-xl border border-transparent min-h-[60px]">
                            ${isMultiple ? '<div class="custom-checkbox mr-4 shrink-0 group-hover:border-indigo-400 transition-colors"></div>' : ''}
                            <span class="text-slate-600 leading-relaxed font-medium group-hover:text-indigo-900 transition-colors">${opt}</span>
                        </label>
                    </div>
                `;
                optionsContainer.insertAdjacentHTML('beforeend', optionHTML);
            });

            const inputs = optionsContainer.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('change', () => {
                    saveAnswer();
                });
            });

            updateNavigationButtons();
        }

        function saveAnswer() {
            const q = quizData[currentQuestionIndex];
            const inputs = optionsContainer.querySelectorAll('input:checked');
            
            if (q.type === 'single') {
                if (inputs.length > 0) {
                    userAnswers[currentQuestionIndex] = parseInt(inputs[0].value);
                } else {
                    userAnswers[currentQuestionIndex] = null;
                }
            } else {
                const selected = Array.from(inputs).map(inp => parseInt(inp.value));
                userAnswers[currentQuestionIndex] = selected;
            }
        }

        function updateNavigationButtons() {
            prevBtn.classList.toggle('hidden', currentQuestionIndex === 0);
            
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            }
        });

        submitBtn.addEventListener('click', () => {
            showModal("Konfirmasi Selesai", "Apakah Anda yakin ingin menyelesaikan kuis sekarang?", true, () => {
                clearInterval(timerInterval);
                finishQuiz(false);
            });
        });

        function calculateScore() {
            let correctCount = 0;
            quizData.forEach((q, i) => {
                const ans = userAnswers[i];
                if (q.type === 'single') {
                    if (ans === q.answer[0]) correctCount++;
                } else {
                    if (ans && ans.length === q.answer.length) {
                        const isCorrect = ans.every(val => q.answer.includes(val));
                        if (isCorrect) correctCount++;
                    }
                }
            });
            const score = Math.round((correctCount / quizData.length) * 100);
            return { score, correctCount };
        }

        function finishQuiz(isTimeout) {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const pesertaName = groupNameInput.value.trim();
            document.getElementById('result-group-name').textContent = "Peserta: " + pesertaName;
            
            if (isTimeout) {
                document.getElementById('timeout-msg').classList.remove('hidden');
            }

            const resultData = calculateScore();
            const finalScore = resultData.score;
            const correctCount = resultData.correctCount;

            // --- KODE PENGIRIMAN DATA KE GOOGLE SPREADSHEET MULAI ---
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwV7l_6N6n05ssz3RQjpCjwuLkr8BcucBLpjP9TAA5f_UtqR4E6JBS9-vSo2Tium-aYRw/exec'; 
            
            // Siapkan data yang akan dikirim
            const formData = new FormData();
            formData.append('nama', pesertaName);
            formData.append('skor', finalScore);
            formData.append('benar', correctCount);

            // Proses kirim ke Google Sheets di background (tanpa mengganggu UI kuis)
            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => console.log('Data sukses terkirim ke Spreadsheet!'))
                .catch(error => console.error('Gagal mengirim data!', error.message));
            // --- KODE PENGIRIMAN DATA KE GOOGLE SPREADSHEET SELESAI ---

            // Tampilkan jumlah benar dari total soal
            document.getElementById('correct-count-display').innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Menjawab Benar: <span class="text-indigo-600 ml-1.5 mr-1.5 font-black text-xl">${correctCount}</span> dari ${quizData.length} Soal
            `;
            
            // Efek berhitung (counting) untuk skor akhir
            let currentScoreDisplay = 0;
            const scoreElement = document.getElementById('score-display');
            const scoreInterval = setInterval(() => {
                if (currentScoreDisplay >= finalScore) {
                    clearInterval(scoreInterval);
                    scoreElement.textContent = finalScore;
                } else {
                    currentScoreDisplay += Math.max(1, Math.floor(finalScore / 20)); 
                    if (currentScoreDisplay > finalScore) currentScoreDisplay = finalScore;
                    scoreElement.textContent = currentScoreDisplay;
                }
            }, 50);

            generateReview();
        }

        function generateReview() {
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            quizData.forEach((q, i) => {
                const userAnswer = userAnswers[i];
                let isCorrect = false;

                if (q.type === 'single') {
                    isCorrect = userAnswer === q.answer[0];
                } else {
                    if (userAnswer && userAnswer.length === q.answer.length) {
                        isCorrect = userAnswer.every(val => q.answer.includes(val));
                    }
                }

                const statusColor = isCorrect ? 'text-teal-600' : 'text-rose-600';
                const statusIcon = isCorrect ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg> Benar' : '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg> Salah';
                const borderStatus = isCorrect ? 'border-teal-200 bg-teal-50/30' : 'border-rose-200 bg-rose-50/30';

                let optionsHTML = '';
                q.options.forEach((opt, idx) => {
                    let optStyle = "text-slate-500 border border-transparent";
                    let icon = '<div class="w-5 h-5 mr-3 shrink-0"></div>'; 
                    
                    const isCorrectOption = q.answer.includes(idx);
                    let isSelectedOption = false;
                    
                    if (q.type === 'single') {
                        isSelectedOption = (userAnswer === idx);
                    } else {
                        isSelectedOption = userAnswer && userAnswer.includes(idx);
                    }

                    if (isCorrectOption) {
                        optStyle = "font-bold text-teal-800 bg-teal-100 border border-teal-200 px-3 py-2 rounded-lg";
                        icon = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 shrink-0 text-teal-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>';
                    } else if (isSelectedOption && !isCorrectOption) {
                        optStyle = "font-medium text-rose-800 line-through bg-rose-100 border border-rose-200 px-3 py-2 rounded-lg opacity-80";
                        icon = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 shrink-0 text-rose-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>';
                    }

                    optionsHTML += `<div class="mb-2 flex items-start ${optStyle}">${icon}<span class="leading-relaxed text-sm md:text-base">${opt}</span></div>`;
                });

                const reviewHTML = `
                    <div class="border-2 rounded-2xl p-5 md:p-6 ${borderStatus} shadow-sm transition hover:shadow-md flex flex-col h-full">
                        <div class="flex justify-between items-center mb-4 border-b border-slate-200/50 pb-3">
                            <span class="font-extrabold text-slate-800 bg-white px-3 py-1 rounded-lg shadow-sm">Soal ${q.number}</span>
                            <span class="font-bold flex items-center ${statusColor}">${statusIcon}</span>
                        </div>
                        <p class="text-slate-800 mb-5 font-semibold text-base sm:text-lg leading-relaxed">${q.question.replace(/\n/g, '<br>')}</p>
                        <div class="mb-5 space-y-1">
                            ${optionsHTML}
                        </div>
                        <div class="bg-white p-4 md:p-5 rounded-xl border border-indigo-100 shadow-sm mt-auto relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-indigo-500"></div>
                            <span class="font-bold text-indigo-800 text-sm md:text-base block mb-2 flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" viewBox="0 0 20 20" fill="currentColor"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z" /></svg>
                                Pembahasan:
                            </span>
                            <p class="text-slate-700 text-sm md:text-base leading-relaxed">${q.explanation}</p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', reviewHTML);
            });
        }
    </script>
</body>
</html>
